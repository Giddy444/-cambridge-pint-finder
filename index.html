async function getPhotos(p){if(photos[p.name])return photos[p.name];try{let u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(p.search)+'&gsrnamespace=6&gsrlimit=2&prop=imageinfo&iiprop=url&iiurlwidth=700&format=json&origin=*';let d=await (await fetch(u)).json();photos[p.name]=Object.values(d.query?.pages||{}).map(x=>x.imageinfo?.[0]?.thumburl).filter(Boolean).slice(0,2)}catch(e){photos[p.name]=[]}return photos[p.name]}
async function render(){if(!map)initMap();markers.forEach(m=>{if(map)map.removeLayer(m)});markers=[];const a=data();document.getElementById('list').innerHTML='';if(!map)document.getElementById('map').innerHTML='<div style="padding:28px;text-align:center;background:#e5e7eb;color:#475467;font-weight:700">Map is temporarily unavailable. The places list below is still working.</div>';a.forEach((p,i)=>{if(!map)return;const mp=p.type==='pub'?minBeerPrice(p):null;let icon=L.divIcon({className:'',html:`<div class="price-marker">${p.type==='pub'?(mp!==null?'£'+mp.toFixed(2):'£—'):'☕'}</div>`,iconSize:[58,26],iconAnchor:[29,13]});let m=L.marker([p.lat,p.lng],{icon}).addTo(map);m.bindPopup(`<b>${p.name}</b><br>${p.type==='pub'?(mp!==null?beerSummary(p):'Beer prices not yet added'):'☕ '+p.item}<br>⭐ ${p.rating}<br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.name+', '+city)}">Navigate</a>`);markers.push(m);loadCard(p,i)});let q=a[0],qp=q&&q.type==='pub'?minBeerPrice(q):null;document.getElementById('quick').textContent=q?(q.type==='pub'?(qp!==null?`From £${qp.toFixed(2)} · ${q.name}`:`${q.name} · prices coming soon`):`☕ ${q.name}`):'Nothing found';document.getElementById('quickMeta').textContent=q?`${city} · ⭐ ${q.rating} · ${q.type==='pub'?beerSummary(q):q.item}`:''}
async function loadCard(p,i){let imgs=await getPhotos(p),ph=imgs.length?`<div class="photos">${imgs.map(u=>`<img loading="lazy" src="${u}" alt="${p.name}">`).join('')}</div>`:'';let d=p.distance?`<span class="distance">${(p.distance*.621371).toFixed(1)} mi</span>`:'';const mp=p.type==='pub'?minBeerPrice(p):null;const beerRows=p.type==='pub'?(p.beers&&p.beers.length?p.beers.map(b=>`<div class="beerRow"><span>🍺 ${b.name}<small>${b.style} · ${b.size||'pint'}${b.lastChecked?' · checked '+b.lastChecked:''}</small></span><b>£${Number(b.price).toFixed(2)}</b></div>`).join(''):`<div class="noBeer">🍺 No individual beer price added yet</div>`):'';let c=document.createElement('div');c.className='card';c.innerHTML=ph+`<div class="body"><div class="top"><div class="name">${i+1}. ${p.name}</div><div class="price">${p.type==='pub'?(mp!==null?'From £'+mp.toFixed(2):'Prices soon'):'☕'}</div></div><div class="meta">⭐ ${p.rating}${d}</div>${p.tags.includes('historic')?'<span class="tag">Historic</span>':''}${p.tags.includes('realale')?'<span class="tag">Real ale</span>':''}${p.tags.includes('coffee')?'<span class="tag">Coffee</span>':''}${p.type==='pub'?`<div class="beerList"><b>🍻 Beer prices</b>${beerRows}</div>`:''}<div class="history">${p.type==='pub'?'🍺 Pub':'☕ Café'} · only prices actually added to the database are shown.</div><a class="nav" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.name+', '+city)}">📍 Navigate</a></div>`;document.getElementById('list').appendChild(c)}
let userMarker=null;function locateMe(){if(!navigator.geolocation)return alert('Location unavailable.');navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lng:p.coords.longitude};const nearest=Object.entries(centers).sort((a,b)=>dist(userPos.lat,userPos.lng,a[1][0],a[1][1])-dist(userPos.lat,userPos.lng,b[1][0],b[1][1]))[0][0];city=nearest;document.getElementById('sub').textContent=city+' • '+(mode==='drink'?'pubs • pints • real ale':'coffee • 0.0% • food • somewhere nice');document.getElementById('crawlBtn').style.display=mode==='drink'?'inline-block':'none';document.getElementById('drinkBtn').classList.toggle('active',mode==='drink');document.getElementById('nodrinkBtn').classList.toggle('active',mode==='nodrink');if(initMap())map.setView([userPos.lat,userPos.lng],14);if(userMarker&&map)map.removeLayer(userMarker);if(map){userMarker=L.circleMarker([userPos.lat,userPos.lng],{radius:9,fillColor:'#1769d2',color:'#fff',weight:4,fillOpacity:1}).addTo(map).bindPopup('📍 Your location');}render()},()=>alert('Please allow Location access for this website in iPhone Settings → Privacy & Security → Location Services → Safari Websites.'))}
function openCrawl(){document.getElementById('crawl').style.display='flex'}function closeCrawl(){document.getElementById('crawl').style.display='none'}function buildCrawl(){let pubs=places.filter(p=>p.city===city&&p.type==='pub'&&!p.tags.includes('club')).sort((a,b)=>b.rating-a.rating),budget=+document.getElementById('budget').value,n=+document.getElementById('pubcount').value,chosen=pubs.slice(0,n);let known=chosen.map(minBeerPrice).filter(x=>x!==null),total=known.reduce((a,b)=>a+b,0);document.getElementById('route').innerHTML=`<div class="total">🍺 ${chosen.length} pubs${known.length===chosen.length?' · estimated total £'+total.toFixed(2):' · route selected by rating'}</div>`+chosen.map((p,i)=>{const pr=minBeerPrice(p);return `<div class="routeitem"><b>${i+1}. ${p.name}</b>${pr!==null?' — from £'+pr.toFixed(2):''}<br><small>⭐ ${p.rating}${pr!==null?' · '+beerSummary(p):' · beer price not added yet'}</small><br><a class="nav" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.name+', '+city)}">📍 Navigate</a></div>`}).join('')}
initMap();chooseMode('drink');document.getElementById('start').style.display='flex';document.getElementById('cities').style.display='none';
